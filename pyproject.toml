[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonelens"
version = "0.1.0"
description = "Turn multi-source phone reviews into a cited, conflict-aware report"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "diankai" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7.0"]

[project.scripts]
phonelens = "phonelens.cli:main"

[tool.setuptools.packages.find]
include = ["phonelens*"]

[tool.setuptools.package-data]
phonelens = ["data/*.json", "webui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
